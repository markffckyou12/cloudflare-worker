  - name: Use Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install dependencies (legal-ops-orchestrator)
    working-directory: legal-ops-orchestrator
    run: npm install --prefer-offline --no-audit --no-fund

  - name: Run tests
    working-directory: legal-ops-orchestrator
    run: npm test
